<!-- Main toolbar -->
<mat-toolbar class="app-toolbar">
  <div class="toolbar-brand">
    <img src="btg-logo-white.svg" alt="BTG Pactual" class="brand-logo" />
  </div>

  <div class="toolbar-nav">
    <a mat-button routerLink="/funds" routerLinkActive="nav-active">
      <mat-icon>list</mat-icon>
      Funds
    </a>
    <a mat-button routerLink="/history" routerLinkActive="nav-active">
      <mat-icon>history</mat-icon>
      History
    </a>
  </div>

  <div class="toolbar-balance">
    <mat-icon>account_balance_wallet</mat-icon>
    <span class="balance-label">Available balance:</span>
    <span class="balance-amount">{{ balance$ | async | copCurrency }}</span>
  </div>
</mat-toolbar>

<!-- Router outlet -->
<main class="app-main">
  <router-outlet></router-outlet>
</main>
